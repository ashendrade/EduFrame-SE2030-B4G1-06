spring.application.name=eduframe-test

# ===================================================================
# TEST SCOPE: MICROSOFT SQL SERVER (SLIIT LAB SHEET CONFIGURATION)
# ===================================================================

app.db.host=${DB_HOST:localhost}
app.db.port=${DB_PORT:1433}
app.db.name=${DB_NAME:master}
app.db.username=${DB_USERNAME:sa}
app.db.password=${DB_PASSWORD:Ashendra@200308}
app.db.encrypt=${DB_ENCRYPT:true}
app.db.trustServerCertificate=${DB_TRUST_CERT:true}

spring.datasource.url=jdbc:sqlserver://${app.db.host}:${app.db.port};databaseName=${app.db.name};encrypt=${app.db.encrypt};trustServerCertificate=${app.db.trustServerCertificate};
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${app.db.username}
spring.datasource.password=${app.db.password}

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
