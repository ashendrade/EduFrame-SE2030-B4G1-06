spring.application.name=eduframe
server.port=8081

# Database Configuration (H2 In-Memory Database for UC-05 Support Tickets)
spring.datasource.url=jdbc:h2:mem:eduframedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible at /h2-console for dev/debug)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Multipart File Upload Settings for Ticket Attachments
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
