spring.application.name=eduframe
server.port=8081

# ===================================================================
# MICROSOFT SQL SERVER (MSSQL LAB SHEET CONFIGURATION)
# 
# Configured with SLIIT lab sheet credentials & connection parameters:
# Server: localhost | Port: 1433 | User: sa | Password: Ashendra@200308
# Encrypt: true | TrustServerCertificate: true
# ===================================================================

# 1. Connection Parameters (Matches SLIIT Lab Sheet Profile)
app.db.host=${DB_HOST:localhost}
app.db.port=${DB_PORT:1433}
app.db.name=${DB_NAME:EduFrame-db}
app.db.username=${DB_USERNAME:sa}
app.db.password=${DB_PASSWORD:Ashendra@200308}
app.db.encrypt=${DB_ENCRYPT:true}
app.db.trustServerCertificate=${DB_TRUST_CERT:true}

# 2. Spring Datasource URL & Driver (MSSQL)
spring.datasource.url=jdbc:sqlserver://${app.db.host}:${app.db.port};databaseName=${app.db.name};encrypt=${app.db.encrypt};trustServerCertificate=${app.db.trustServerCertificate};sendTimeAsDatetime=false;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${app.db.username}
spring.datasource.password=${app.db.password}

# 3. Hibernate JPA Dialect & DDL for MSSQL
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always

# Multipart File Upload Settings (Support HD video advertisement uploads up to 500MB)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
