# ===================================================================
# MICROSOFT SQL SERVER PROFILE (application-mssql.properties)
# Activate with: --spring.profiles.active=mssql
# ===================================================================

app.db.host=${DB_HOST:localhost}
app.db.port=${DB_PORT:1433}
app.db.name=${DB_NAME:EduFrame-db}
app.db.username=${DB_USERNAME:sa}
app.db.password=${DB_PASSWORD:Ashendra@200308}
app.db.encrypt=${DB_ENCRYPT:true}
app.db.trustServerCertificate=${DB_TRUST_CERT:true}

spring.datasource.url=jdbc:sqlserver://${app.db.host}:${app.db.port};databaseName=${app.db.name};encrypt=${app.db.encrypt};trustServerCertificate=${app.db.trustServerCertificate};sendTimeAsDatetime=false;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${app.db.username}
spring.datasource.password=${app.db.password}

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
