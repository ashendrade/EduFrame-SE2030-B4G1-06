<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: html-head('Help & Support Desk')}"></head>
<body>

    <!-- 1. SLIIT Styled Nav Header -->
    <div th:replace="~{layout/base :: header('support')}"></div>

    <!-- 2. Support Portal Hero Header -->
    <section class="hero" style="padding: 40px 0; background: linear-gradient(135deg, var(--color-primary-dark) 0%, var(--color-primary) 100%);">
        <div class="container hero-content" style="text-align: center;">
            <h1 class="animate-fade">EduFrame <span>Support Portal</span></h1>
            <p class="animate-fade" style="animation-delay: 0.1s; max-width: 700px; margin: 0 auto;">
                Submit academic and technical help tickets (UC-05). Track resolution statuses and receive instant digital eTicketReceipt confirmation.
            </p>
        </div>
    </section>

    <!-- 3. Main Support Component Mounting Section -->
    <main class="container" style="margin-top: 40px; margin-bottom: 60px;">
        <div style="max-width: 1100px; margin: 0 auto;">
            <!-- React Support Ticket Component Mounting Target -->
            <div id="support-ticket-root"></div>
        </div>
    </main>

    <!-- 4. Footer -->
    <div th:replace="~{layout/base :: footer}"></div>
    
    <!-- 5. Scripts -->
    <div th:replace="~{layout/base :: scripts}"></div>

</body>
</html>
