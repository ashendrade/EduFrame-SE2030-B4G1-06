<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login - EduFrame SLIIT</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="login-body">

    <div class="login-card animate-fade">
        <!-- Brand Header -->
        <div class="login-header">
            <div class="logo-symbol">E</div>
            <h1 style="color: white; font-size: 26px; margin-top: 10px; margin-bottom: 4px;">Edu<span>Frame</span></h1>
            <h2>SLIIT Educational Portal</h2>
        </div>
        
        <!-- Login Form -->
        <div class="login-form-body">
            <!-- Normal Spring Security Form login mapping -->
            <form th:action="@{/login}" method="post">
                
                <div class="form-group">
                    <label for="username">Email / Registration ID</label>
                    <div style="position: relative;">
                        <input type="text" id="username" name="username" class="form-control" placeholder="e.g. admin@eduframe.lk or student1@eduframe.lk" style="padding-left: 45px;" required autofocus>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted);"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </div>
                </div>
                
                <div class="form-group" style="margin-bottom: 24px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <label for="password" style="margin-bottom: 0;">Password</label>
                        <a href="#" style="font-size: 12px; color: var(--color-accent); font-weight: 600;">Forgot Password?</a>
                    </div>
                    
                    <div style="position: relative;">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Enter your portal password" style="padding-left: 45px;" required>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted);"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </div>
                </div>
                
                <!-- Spring security error handling UI -->
                <div th:if="${param.error}" style="background-color: rgba(239, 68, 68, 0.1); border: 1px solid var(--color-danger); color: var(--color-danger); padding: 12px; border-radius: var(--radius-md); font-size: 13px; margin-bottom: 20px; font-weight: 500;">
                    Invalid email or password. Please try again.
                </div>
                
                <div th:if="${param.logout}" style="background-color: rgba(16, 185, 129, 0.1); border: 1px solid var(--color-success); color: var(--color-success); padding: 12px; border-radius: var(--radius-md); font-size: 13px; margin-bottom: 20px; font-weight: 500;">
                    You have successfully signed out of the portal.
                </div>

                <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="width: 100%; padding: 12px; margin-bottom: 20px; font-size: 15px; font-weight: 700;">Sign In</button>

                <div style="text-align: center; font-size: 13px; color: var(--color-text-muted); border-top: 1px solid var(--color-border); padding-top: 16px;">
                    Don't have an account? <a th:href="@{/register}" style="color: var(--color-secondary); font-weight: 700;">Register Here</a>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
