<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: html-head('Account Profile')}"></head>
<body>

    <!-- 1. Navigation Header -->
    <div th:replace="~{layout/base :: header('profile')}"></div>

    <!-- 2. Hero Section -->
    <section class="hero" style="padding: 40px 0; background: linear-gradient(135deg, var(--color-primary-dark) 0%, var(--color-primary) 100%);">
        <div class="container hero-content" style="text-align: center;">
            <h1 class="animate-fade">Account <span>Profile</span></h1>
            <p class="animate-fade" style="animation-delay: 0.1s; max-width: 600px; margin: 0 auto;">
                View and update your account details, credentials, and profile settings.
            </p>
        </div>
    </section>

    <!-- 3. Profile Form Container -->
    <main class="container" style="margin-top: 40px; margin-bottom: 60px; max-width: 720px;">
        <div style="background-color: var(--color-bg-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 36px; border: 1px solid var(--color-border);" class="animate-fade">
            
            <div style="display: flex; align-items: center; gap: 20px; padding-bottom: 24px; margin-bottom: 28px; border-bottom: 1px solid var(--color-border);">
                <div style="width: 72px; height: 72px; border-radius: var(--radius-full); background: linear-gradient(135deg, var(--color-secondary), var(--color-accent)); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: var(--color-primary-dark); box-shadow: 0 4px 12px rgba(242, 169, 0, 0.3);">
                    <span th:text="${user != null and user.fullName != null and !user.fullName.isEmpty() ? #strings.substring(user.fullName, 0, 1).toUpperCase() : 'U'}">U</span>
                </div>
                <div>
                    <h2 style="font-size: 22px; color: var(--color-primary); margin-bottom: 4px;" th:text="${user != null ? user.fullName : 'Account User'}">Account User</h2>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span style="font-size: 13px; color: var(--color-text-muted);" th:text="${user != null ? user.email : ''}">user@eduframe.lk</span>
                        <span style="background-color: rgba(242, 169, 0, 0.15); color: #d19200; border: 1px solid rgba(242, 169, 0, 0.4); padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase;" th:text="${user != null ? user.role : 'STUDENT'}">STUDENT</span>
                    </div>
                </div>
            </div>

            <!-- Success Notification -->
            <div th:if="${successMessage}" style="background-color: rgba(16, 185, 129, 0.1); border: 1px solid var(--color-success); color: var(--color-success); padding: 14px 18px; border-radius: var(--radius-md); font-size: 14px; margin-bottom: 24px; font-weight: 600; display: flex; align-items: center; gap: 10px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                <span th:text="${successMessage}"></span>
            </div>

            <!-- Error Notification -->
            <div th:if="${errorMessage}" style="background-color: rgba(239, 68, 68, 0.1); border: 1px solid var(--color-danger); color: var(--color-danger); padding: 14px 18px; border-radius: var(--radius-md); font-size: 14px; margin-bottom: 24px; font-weight: 600; display: flex; align-items: center; gap: 10px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/profile}" method="post">
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="fullName" style="font-weight: 600; color: var(--color-primary); font-size: 14px; margin-bottom: 6px; display: block;">Full Name</label>
                    <div style="position: relative;">
                        <input type="text" id="fullName" name="fullName" class="form-control" th:value="${user != null ? user.fullName : ''}" required style="padding-left: 45px; height: 46px; border-radius: var(--radius-md); border: 1px solid var(--color-border); font-weight: 500;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted);"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="email" style="font-weight: 600; color: var(--color-primary); font-size: 14px; margin-bottom: 6px; display: block;">Email Address</label>
                    <div style="position: relative;">
                        <input type="email" id="email" name="email" class="form-control" th:value="${user != null ? user.email : ''}" required style="padding-left: 45px; height: 46px; border-radius: var(--radius-md); border: 1px solid var(--color-border); font-weight: 500;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted);"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    </div>
                </div>

                <div style="margin-top: 28px; margin-bottom: 20px; padding-top: 20px; border-top: 1px dashed var(--color-border);">
                    <h3 style="font-size: 16px; color: var(--color-primary); margin-bottom: 4px;">Change Password (Optional)</h3>
                    <p style="font-size: 13px; color: var(--color-text-muted); margin-bottom: 16px;">Leave blank if you do not wish to change your current password.</p>

                    <div class="form-group" style="margin-bottom: 16px;">
                        <label for="currentPassword" style="font-weight: 600; color: var(--color-primary); font-size: 13.5px; margin-bottom: 6px; display: block;">Current Password</label>
                        <div style="position: relative;">
                            <input type="password" id="currentPassword" name="currentPassword" class="form-control" placeholder="Required only if changing password" style="padding-left: 45px; height: 46px; border-radius: var(--radius-md); border: 1px solid var(--color-border);">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted);"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom: 24px;">
                        <label for="newPassword" style="font-weight: 600; color: var(--color-primary); font-size: 13.5px; margin-bottom: 6px; display: block;">New Password</label>
                        <div style="position: relative;">
                            <input type="password" id="newPassword" name="newPassword" class="form-control" placeholder="Minimum 6 characters" minlength="6" style="padding-left: 45px; height: 46px; border-radius: var(--radius-md); border: 1px solid var(--color-border);">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted);"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 14px; justify-content: flex-end; margin-top: 24px;">
                    <a th:href="@{/}" class="btn btn-outline-light" style="padding: 11px 24px; color: var(--color-text-muted); border-color: var(--color-border);">Cancel</a>
                    <button type="submit" class="btn btn-primary" style="padding: 11px 28px; font-weight: 700; background: linear-gradient(135deg, var(--color-secondary), var(--color-accent)); color: var(--color-primary-dark); border: none;">Save Profile Changes</button>
                </div>
            </form>
        </div>
    </main>

    <!-- 4. Footer -->
    <div th:replace="~{layout/base :: footer}"></div>
    
    <!-- 5. Scripts -->
    <div th:replace="~{layout/base :: scripts}"></div>

</body>
</html>
