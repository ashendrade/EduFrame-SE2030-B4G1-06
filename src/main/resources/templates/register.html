<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - EduFrame SLIIT</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="login-body">

    <div class="login-card animate-fade" style="max-width: 480px;">
        <!-- Brand Header -->
        <div class="login-header">
            <div class="logo-symbol">E</div>
            <h1 style="color: white; font-size: 26px; margin-top: 10px; margin-bottom: 4px;">Edu<span>Frame</span></h1>
            <h2>Student Account Registration</h2>
        </div>
        
        <!-- Registration Form Body -->
        <div class="login-form-body">
            
            <!-- Success Notification -->
            <div th:if="${successMessage}" style="background-color: rgba(16, 185, 129, 0.1); border: 1px solid var(--color-success); color: var(--color-success); padding: 12px; border-radius: var(--radius-md); font-size: 13.5px; margin-bottom: 20px; font-weight: 500;">
                <span th:text="${successMessage}"></span>
            </div>

            <!-- Error Notification -->
            <div th:if="${errorMessage}" style="background-color: rgba(239, 68, 68, 0.1); border: 1px solid var(--color-danger); color: var(--color-danger); padding: 12px; border-radius: var(--radius-md); font-size: 13.5px; margin-bottom: 20px; font-weight: 500;">
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/register}" method="post">
                
                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="fullName">Full Name</label>
                    <div style="position: relative;">
                        <input type="text" id="fullName" name="fullName" class="form-control" placeholder="e.g. Kasun Perera" style="padding-left: 45px;" required autofocus>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted);"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="email">Student Email Address</label>
                    <div style="position: relative;">
                        <input type="email" id="email" name="email" class="form-control" placeholder="e.g. student@my.sliit.lk" style="padding-left: 45px;" required>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted);"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                    </div>
                </div>
                
                <div class="form-group" style="margin-bottom: 24px;">
                    <label for="password">Create Password</label>
                    <div style="position: relative;">
                        <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" style="padding-left: 45px; padding-right: 45px;" required minlength="6">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted);"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <button type="button" id="toggleRegPasswordBtn" onclick="togglePasswordVisibility('password', this)" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--color-text-muted); padding: 0; display: flex; align-items: center;" title="Show Password">
                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-bottom: 20px; font-size: 15px; font-weight: 700;">Create Student Account</button>

                <div style="text-align: center; font-size: 13px; color: var(--color-text-muted); border-top: 1px solid var(--color-border); padding-top: 16px;">
                    Already registered? <a th:href="@{/login}" style="color: var(--color-secondary); font-weight: 700;">Sign In Here</a>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
